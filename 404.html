<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Lanworks</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafaf9; --text: #17171a; --muted: #6b6b73; --line: #d4d3ce; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --text: #ededf0; --muted: #9d9da6; --line: #34343b; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; }
    .code { margin: 0; color: var(--muted); font: 500 13px ui-monospace, Consolas, monospace; letter-spacing: .08em; }
    h1 { margin: 8px 0 6px; font-size: 32px; font-weight: 650; letter-spacing: -.03em; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { display: inline-block; padding: 9px 16px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none; font-weight: 550; }
  </style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>That page doesn't exist, or it has moved.</p>
    <a id="home" href="/">Back to Lanworks</a>
  </div>
  <script>
    // On a GitHub "project" site the hub lives at /<repo>/, not at the domain root.
    const seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
  </script>
</body>
</html>
